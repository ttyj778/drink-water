<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#a5d8ff">
<title>喝水打卡</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: linear-gradient(160deg, #e7f5ff 0%, #a5d8ff 55%, #74c0fc 100%);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .card {
    width: 100%;
    max-width: 360px;
    padding: 26px 24px 22px;
    text-align: center;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 28px;
    box-shadow: 0 20px 45px rgba(30, 90, 150, 0.18);
  }

  .date {
    font-size: 13px;
    color: #7b8fa1;
    letter-spacing: 0.5px;
  }

  h1 {
    margin-top: 6px;
    font-size: 17px;
    font-weight: 600;
    color: #3d5566;
    letter-spacing: 1px;
  }

  .count-wrap {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 4px;
    margin-top: 6px;
  }

  .count {
    font-size: 64px;
    font-weight: 800;
    line-height: 1.1;
    color: #1c7ed6;
    font-variant-numeric: tabular-nums;
    transition: color 0.3s;
  }

  .unit {
    font-size: 18px;
    color: #7b8fa1;
  }

  .goal {
    margin-top: 2px;
    font-size: 13px;
    color: #93a5b5;
  }

  /* 8 个小水滴 */
  .drops {
    display: flex;
    justify-content: center;
    gap: 11px;
    margin: 18px 0 4px;
    height: 22px;
  }

  .drop {
    display: block;
    width: 16px;
    height: 16px;
    background: #dce9f7;
    border-radius: 50% 0 50% 50%;
    transform: rotate(-45deg);
    transition: background 0.3s, box-shadow 0.3s, transform 0.3s;
  }

  .drop.on {
    background: linear-gradient(135deg, #74c0fc, #1c7ed6);
    box-shadow: 0 2px 8px rgba(28, 126, 214, 0.45);
    transform: rotate(-45deg) scale(1.12);
  }

  /* 大按钮 */
  .main-btn {
    position: relative;
    display: block;
    width: 168px;
    height: 168px;
    margin: 22px auto 6px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-family: inherit;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
    background: linear-gradient(145deg, #4dabf7, #1c7ed6);
    box-shadow: 0 14px 28px rgba(28, 126, 214, 0.38),
                inset 0 -5px 12px rgba(0, 0, 0, 0.12),
                inset 0 5px 12px rgba(255, 255, 255, 0.25);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    touch-action: manipulation;
  }

  .main-btn:active {
    transform: scale(0.94);
    box-shadow: 0 6px 16px rgba(28, 126, 214, 0.35),
                inset 0 -3px 10px rgba(0, 0, 0, 0.12);
  }

  /* +1 飘字 */
  .fly {
    position: absolute;
    left: 50%;
    top: 42%;
    font-size: 26px;
    font-weight: 800;
    color: #fff;
    pointer-events: none;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    animation: flyUp 0.8s ease-out forwards;
  }

  @keyframes flyUp {
    0%   { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
    100% { opacity: 0; transform: translate(-50%, -180%) scale(1.5); }
  }

  .tip {
    min-height: 20px;
    margin-top: 10px;
    font-size: 13px;
    color: #7b8fa1;
    transition: color 0.3s;
  }

  .actions {
    display: flex;
    gap: 12px;
    margin-top: 18px;
  }

  .ghost {
    flex: 1;
    padding: 11px 0;
    font-family: inherit;
    font-size: 14px;
    color: #4a7fa5;
    background: #eaf4fd;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    touch-action: manipulation;
  }

  .ghost:active {
    background: #d8eafb;
    transform: scale(0.97);
  }
</style>
</head>
<body>

  <div class="card">
    <div class="date" id="date">今天</div>
    <h1>今日喝水</h1>

    <div class="count-wrap">
      <span class="count" id="count">0</span>
      <span class="unit">杯</span>
    </div>
    <div class="goal" id="goalText">目标 8 杯</div>

    <div class="drops" id="drops"></div>

    <button class="main-btn" id="drinkBtn">喝一杯</button>

    <p class="tip" id="tip">点一下大按钮，记下第一杯 💪</p>

    <div class="actions">
      <button class="ghost" id="undoBtn">撤销一杯</button>
      <button class="ghost" id="resetBtn">清零</button>
    </div>
  </div>

<script>
  /* ====== 基本设置（想改目标杯数就改这里） ====== */
  var GOAL = 8;
  var STORE_KEY = 'drink-water-record';

  /* ====== 拿到页面元素 ====== */
  var countEl  = document.getElementById('count');
  var dropsEl  = document.getElementById('drops');
  var tipEl    = document.getElementById('tip');
  var dateEl   = document.getElementById('date');
  var goalEl   = document.getElementById('goalText');
  var drinkBtn = document.getElementById('drinkBtn');
  var undoBtn  = document.getElementById('undoBtn');
  var resetBtn = document.getElementById('resetBtn');

  var count = 0;      // 今天喝了几杯
  var dateKey = '';   // 记录属于哪一天，例如 "2025-6-8"

  goalEl.textContent = '目标 ' + GOAL + ' 杯';

  /* ====== 工具函数 ====== */
  // 生成今天的日期标识
  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  // 读取本地数据
  function loadData() {
    dateKey = todayKey();
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) { count = 0; return; }
      var data = JSON.parse(raw);
      // 只有日期是同一天才沿用，否则从 0 开始
      if (data && data.date === dateKey && typeof data.count === 'number') {
        count = data.count;
      } else {
        count = 0;
      }
    } catch (e) {
      count = 0;
    }
  }

  // 保存到本地
  function saveData() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        date: dateKey,
        count: count
      }));
    } catch (e) {
      // 隐私模式等情况下保存失败，也不影响使用
    }
  }

  // 显示日期
  function renderDate() {
    var d = new Date();
    var week = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
    dateEl.textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 星期' + week;
  }

  // 刷新界面
  function render() {
    renderDate();
    countEl.textContent = count;

    // 画小水滴
    dropsEl.innerHTML = '';
    for (var i = 0; i < GOAL; i++) {
      var drop = document.createElement('i');
      drop.className = 'drop' + (i < count ? ' on' : '');
      dropsEl.appendChild(drop);
    }

    // 提示文字
    if (count === 0) {
      tipEl.textContent = '点一下大按钮，记下第一杯 💪';
      tipEl.style.color = '#7b8fa1';
    } else if (count < GOAL) {
      tipEl.textContent = '已喝 ' + count + ' 杯，还差 ' + (GOAL - count) + ' 杯';
      tipEl.style.color = '#7b8fa1';
    } else {
      tipEl.textContent = '🎉 今日目标达成，太棒了！';
      tipEl.style.color = '#1c7ed6';
    }
  }

  /* ====== 检查是否跨天（页面开着过夜也不会算错） ====== */
  function checkNewDay() {
    if (todayKey() !== dateKey) {
      dateKey = todayKey();
      count = 0;
      saveData();
      render();
    }
  }

  /* ====== 按钮事件 ====== */
  drinkBtn.addEventListener('click', function () {
    checkNewDay();
    count++;
    saveData();
    render();

    // 手机轻微震动（支持的设备才有）
    if (navigator.vibrate) { navigator.vibrate(15); }

    // +1 飘字动画
    var fly = document.createElement('span');
    fly.className = 'fly';
    fly.textContent = '+1';
    drinkBtn.appendChild(fly);
    setTimeout(function () { fly.remove(); }, 800);
  });

  undoBtn.addEventListener('click', function () {
    checkNewDay();
    if (count > 0) {
      count--;
      saveData();
      render();
    }
  });

  resetBtn.addEventListener('click', function () {
    if (confirm('确定要清空今天的喝水记录吗？')) {
      count = 0;
      dateKey = todayKey();
      saveData();
      render();
    }
  });

  /* ====== 启动 ====== */
  loadData();
  render();

  // 每 30 秒检查一次是否到了新的一天
  setInterval(function () {
    checkNewDay();
    renderDate();
  }, 30000);
</script>

</body>
      </html>
